name: Build Hohhot Weather Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 与 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 使用 Capacitor 自动封装 Web 核心为原生安卓工程
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "呼市气象AI" "com.doralix.hohhotweather" --web-dir www
          npx cap add android

      - name: 4. 注入网络与高精度定位权限并开启 Cleartext/HTTPS 支持
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. 上传编译完成的 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: hohhot-weather-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
